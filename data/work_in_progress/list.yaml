- title: "Mind the Gap: Understanding Socio-economic Inequality in Mental Health"
  # pdflink: "/pdf/GenderGenerosityAERPP2013Final.pdf"
  # book: "American Economic Review Papers and Proceedings, May 2013"
  coauthors: 
    - name: "Will Parker"
      website: "https://wdhparker.github.io/"
    - name: "Johannes Spinnewijn"
      website: "https://personal.lse.ac.uk/spinnewi/"
  # links:
  #   - url: "/pdf/GenderGenerosityAERP&P2013OnlineApp.pdf"
  #     text: "Online Appendix"
  abstract: >
    This paper quantifies mental health inequality and explores the underlying mechanisms using administrative data covering the entire Dutch population. Individuals at the bottom of the income distribution use psychotropic medications 2.5 times more, are hospitalized for mental health conditions 3 times more, and die by suicide 3.5 times more than those at the top. Unequal healthcare access cannot explain this gradient, allowing us to focus on the decomposition into two key channels: social causation (poverty causing poor mental health) and social drift (poor mental health causing poverty). We find limited evidence for social causation except during adolescence. The gradient is instead primarily driven by social drift: mental health shocks impose substantial earnings penalties, with work status as the key mediator. These findings highlight the value of targeted mental disorder prevention for children of low-income parents and enhanced social insurance against the economic costs of mental illness.

- title: "The Fundamental Need for Shelter: Evidence from the World’s Largest Home Reconstruction Program"
  # pdflink: "/pdf/GenderGenerosityAERPP2013Final.pdf"
  # book: "American Economic Review Papers and Proceedings, May 2013"
  coauthors: 
    - name: "Amen Jalal"
      website: "https://amenjalal.com/"
    - name: "Pol Simpson"
      website: "https://polsimpson.github.io/"
  # links:
  #   - url: "/pdf/GenderGenerosityAERP&P2013OnlineApp.pdf"
  #     text: "Online Appendix"
  abstract: >
    Psychologists have long argued that human needs are met in order of priority: until basic needs such as shelter are secured, attention and effort remain focused on them, delaying higher-order pursuits. This idea has implications for a range of economic outcomes — shaping, for instance, how much background risk a household bears and, thus, how willing it is to make high-risk, high-reward investments in the future. Despite its influence, the idea that needs follow a hierarchy has rarely been tested using credible causal evidence on economic behaviour. We provide such a test using the reconstruction of flood-destroyed homes in Sindh, Pakistan. Exploiting staggered disbursements of home-reconstruction grants, we compare otherwise-similar households that received funding just before and just after a program expansion. Combining administrative records with a survey of 6,000 households, we estimate the effects of home security on risk-taking, migration, health, schooling, and productive investment.

  