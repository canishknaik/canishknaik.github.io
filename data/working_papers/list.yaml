- title: "Mental Health and the Targeting of Social Assistance"
  pdflink: "/pdf/MHSA_CN_JMP.pdf"
  note: "CESifo Distinguished Affiliate Award in Behavioral Economics, REStud NA Tour"
  book: "October 2026"
  # coauthors: "No one"
  # links:
  #   - url: "/pdf/GenderGenerosityAERP&P2013OnlineApp.pdf"
  #     text: "Online Appendix"
  abstract: >
    People with mental disorders are vulnerable, yet may struggle to overcome barriers to assistance. In population-wide Dutch administrative data, they are 3× more likely to be poor than people with good mental health, yet receive social assistance at similar rates. Policies raising barriers disproportionately screen out those with mental disorders. This is not due to lower need: they respond more to exogenous variation in benefits. Combining these patterns with a model implies a 57% higher cost of barriers and 2.2× marginal value of benefits for poor versus good mental health, conditional on income. Thus, similar take-up levels mask poor targeting.

- title: "Choice Errors and Choice Restrictions in Public Housing Allocation"
  pdflink: "/pdf/choice_errors_restrictions.pdf"
  book: "September 2026"
  coauthors: 
    - name: "Neil Thakral"
      website: "https://neilthakral.github.io/"
  links:
    - url: "/pdf/choice_errors_restrictions_appendix.pdf"
      text: "Online Appendix"
  abstract: >
    Public-housing authorities restrict applicants' choices to balance prioritizing vulnerable households against preventing congestion. How do applicants' mistakes influence the effectiveness of these restrictions? We combine administrative vacancy data with a survey of 587 UK public-housing residents, estimating preferences via a choice experiment and eliciting behavioral biases. We compare two policies: the UK-mechanism batches arrivals and restricts acceptances; the US-mechanism restricts rejections. Under rationality, the US-mechanism reduces congestion but delivers smaller match-quality advantages for higher-priority applicants than the UK-mechanism. Bias affects the UK-mechanism more strongly overall. Some individual mistakes even improve social welfare by reducing congestion. The welfare ranking of the mechanisms therefore depends on applicant biases.
    
- title: "Intrapersonal Comparisons as Interpersonal Comparisons"
  pdflink: "/pdf/intrapersonalcomparisons.pdf"
  book: "October 2025"
  coauthors: 
    - name: "Daniel Reck"
      website: "https://www.danreck.com/"
  # links:
  #   - url: "/pdf/GenderGenerosityAERP&P2013OnlineApp.pdf"
  #     text: "Online Appendix"
  abstract: >
    Inconsistent choice undermines the revealed preference foundations of traditional welfare economics, leading to controversy about policymaking in the presence of behavioral frictions. We model an optimal policy problem wherein a benevolent planner is uncertain which behavioral frame reveals normative preferences. We axiomatize welfarist criteria that are similar to social welfare functions, with intrapersonal frames replacing interpersonal types. Under paternalistic ambiguity aversion or paternalistic risk aversion, the planner values policies that are robust to normative uncertainty. We apply these welfarist criteria and robustness concepts in examples, including default options, manipulation of reference points, present focus, corrective taxation for internalities, and nudging.